services:
  postgres:
    image: postgres:16
    container_name: plaing-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plaing}
      POSTGRES_USER: ${POSTGRES_USER:-plaing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plaing}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: plaing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
